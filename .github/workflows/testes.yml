name: testes

on:
  push:
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - run: npm ci
      - run: npm test

  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agente/requirements.txt
      - run: python -m unittest discover -s agente/testes -v
